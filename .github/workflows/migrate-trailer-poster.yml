name: Migrate trailer poster
on:
  push:
    paths:
      - '.github/workflows/migrate-trailer-poster.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original Xiec trailer poster
        run: |
          curl -fL --retry 5 --retry-delay 2             https://xiec-fiaz.onrender.com/trailer-poster.png             -o trailer-poster.png
          test -s trailer-poster.png
          file trailer-poster.png
      - name: Commit poster into XemXiec
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trailer-poster.png
          git diff --cached --quiet && exit 0
          git commit -m "Restore original Xiec trailer poster"
          git push
